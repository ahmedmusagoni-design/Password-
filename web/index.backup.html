<!doctype html>
<!--
THESIS: A quiet family operations desk makes device links and their limits visible at a glance.
OWN-WORLD: Warm paper, ink-dark chrome, precise dividers, and a single signal-orange accent echo the LocalHost Manager reference.
STORY: Parents manage child profiles, share a one-time link, and can revoke it; children see the consent terms before joining.
FIRST VIEWPORT: A fixed rail frames a compact workspace header and family overview; invite and linked-device rows lead the page.
FORM: An Operate-mode family dashboard, translating the reference's local-service console structure without copying its product claims.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1b1a19">
    <meta name="description" content="A family dashboard for child-submitted summaries and child-initiated alerts.">
    <meta name="application-name" content="Family Safety">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/family.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <title>Family Safety</title>
  </head>
  <body>
    <div id="app">
      <main class="boot" aria-live="polite">
        <img src="/icons/family.svg" width="36" height="36" alt="">
        <p>Opening your family space…</p>
      </main>
    </div>
    <script src="/app.js" defer></script>
  </body>
