services:
  - type: web
    name: family-safety
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm --prefix server install --omit=dev
    startCommand: node server/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PARENT_API_DATA_FILE
        value: /var/data/data.json
    disk:
      name: family-safety-data
      mountPath: /var/data
      sizeGB: 1
